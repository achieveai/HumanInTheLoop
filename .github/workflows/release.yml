name: Build & Release HITL Client

on:
  push:
    tags:
      - 'v*'
      - 'inbox-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-client:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hitl-client-windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hitl-client-linux-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: hitl-client-macos-arm64
          # Cross-compiled from the arm64 `macos-latest` runner: GitHub is
          # retiring the Intel `macos-13` runners and jobs queued on them never
          # start. Apple's SDK carries both slices, so `--target
          # x86_64-apple-darwin` (passed to Tauri below) is a real cross-compile.
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: hitl-client-macos-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev

      - name: Install frontend dependencies
        working-directory: hitl-mcp-server/client
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: hitl-mcp-server/client
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      # Paths below are the CARGO WORKSPACE target dir (hitl-mcp-server/target/),
      # not client/src-tauri/target/. The client stopped being its own workspace
      # root when hitl-mcp-server/Cargo.toml started listing it as a member, which
      # relocated the build output. Every copy here fails soft, and
      # `if-no-files-found: error` turns that into a red release rather than a
      # missing binary - so a stale prefix empties the release without a clue why.
      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          $msi = Get-ChildItem -Path "hitl-mcp-server/target/${{ matrix.target }}/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Path "hitl-mcp-server/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $bin = "hitl-mcp-server/target/${{ matrix.target }}/release/hitl-client.exe"
          if ($msi) { Copy-Item $msi.FullName "artifacts/${{ matrix.artifact }}.msi" }
          if ($exe) { Copy-Item $exe.FullName "artifacts/${{ matrix.artifact }}-setup.exe" }
          if (Test-Path $bin) { Copy-Item $bin "artifacts/${{ matrix.artifact }}.exe" }

      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cp hitl-mcp-server/target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/${{ matrix.artifact }}.deb 2>/dev/null || true
          cp hitl-mcp-server/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage artifacts/${{ matrix.artifact }}.AppImage 2>/dev/null || true
          cp hitl-mcp-server/target/${{ matrix.target }}/release/hitl-client artifacts/${{ matrix.artifact }} 2>/dev/null || true

      - name: Collect macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p artifacts
          DMG=$(find hitl-mcp-server/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then cp "$DMG" "artifacts/${{ matrix.artifact }}.dmg"; fi
          BIN="hitl-mcp-server/target/${{ matrix.target }}/release/hitl-client"
          if [ -f "$BIN" ]; then cp "$BIN" "artifacts/${{ matrix.artifact }}"; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  build-inbox:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/inbox-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Inbox is intentionally not an npm workspace. The root lockfile still
      # installs the shared Tauri CLI through the client workspace.
      - name: Install frontend dependencies
        working-directory: hitl-mcp-server
        run: npm ci

      - name: Validate Inbox tag version
        if: startsWith(github.ref, 'refs/tags/inbox-v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring("inbox-v".Length)
          $packageVersion = (Get-Content -Raw "hitl-mcp-server/inbox/package.json" | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Inbox tag version '$tagVersion' does not match package version '$packageVersion'."
          }

      # The existing Tauri beforeBuildCommand runs `npm run sync`, which copies
      # the shared review UI into Inbox before compiling the native application.
      - name: Build Inbox MSI
        working-directory: hitl-mcp-server/inbox
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles msi

      - name: Prepare Inbox release assets
        shell: pwsh
        run: |
          $sourceRoot = "hitl-mcp-server/target/x86_64-pc-windows-msvc/release"
          $msiFiles = @(Get-ChildItem -LiteralPath "$sourceRoot/bundle/msi" -Filter "*.msi" -File)
          $binary = "$sourceRoot/hitl-inbox.exe"

          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one Inbox MSI, found $($msiFiles.Count)."
          }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf) -or (Get-Item -LiteralPath $binary).Length -eq 0) {
            throw "Inbox executable is missing or empty: $binary"
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $msiAsset = "artifacts/hitl-inbox-windows-x64.msi"
          $exeAsset = "artifacts/hitl-inbox-windows-x64.exe"
          $zipAsset = "artifacts/hitl-inbox-windows-x64.zip"
          $checksumAsset = "artifacts/hitl-inbox-windows-x64.sha256"

          Copy-Item -LiteralPath $msiFiles[0].FullName -Destination $msiAsset
          Copy-Item -LiteralPath $binary -Destination $exeAsset
          Compress-Archive -LiteralPath $exeAsset -DestinationPath $zipAsset -Force

          $releaseAssets = @($msiAsset, $exeAsset, $zipAsset)
          foreach ($asset in $releaseAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -eq 0) {
              throw "Inbox release asset is missing or empty: $asset"
            }
          }

          $checksums = foreach ($asset in $releaseAssets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $checksums | Set-Content -LiteralPath $checksumAsset -Encoding ascii
          if (-not (Test-Path -LiteralPath $checksumAsset -PathType Leaf) -or (Get-Item -LiteralPath $checksumAsset).Length -eq 0) {
            throw "Inbox checksum file is missing or empty: $checksumAsset"
          }

      - name: Upload Inbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hitl-inbox-windows-x64
          path: artifacts/hitl-inbox-windows-x64.*
          if-no-files-found: error

  publish-release:
    needs: [build-client, build-inbox]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lR release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-inbox-release:
    needs: build-inbox
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/inbox-v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Inbox artifacts
        uses: actions/download-artifact@v4
        with:
          name: hitl-inbox-windows-x64
          path: release-assets

      - name: List Inbox release assets
        run: ls -lR release-assets/

      - name: Create Inbox GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body: |
            Windows x64 Inbox build. These artifacts are unsigned.
            The portable ZIP contains only the raw executable. It requires Microsoft Edge WebView2 Runtime and the user's configuration under `.hitl`.
            Android is not included in this release.
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: build-client
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Lifted to job-level env so the publish step can test for the secret's
    # presence: the `secrets` context is not available in a step-level `if`.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: hitl-mcp-server
        run: npm install

      - name: Build server
        working-directory: hitl-mcp-server
        run: npm run build:server

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: client-artifacts

      - name: Bundle client binaries into server package
        run: |
          mkdir -p hitl-mcp-server/server/dist/bin

          # Windows x64
          mkdir -p hitl-mcp-server/server/dist/bin/windows-x64
          cp client-artifacts/hitl-client-windows-x64/hitl-client-windows-x64.exe \
             hitl-mcp-server/server/dist/bin/windows-x64/hitl-client.exe 2>/dev/null || true

          # Linux x64
          mkdir -p hitl-mcp-server/server/dist/bin/linux-x64
          cp client-artifacts/hitl-client-linux-x64/hitl-client-linux-x64 \
             hitl-mcp-server/server/dist/bin/linux-x64/hitl-client 2>/dev/null || true
          chmod +x hitl-mcp-server/server/dist/bin/linux-x64/hitl-client 2>/dev/null || true

          # macOS arm64
          mkdir -p hitl-mcp-server/server/dist/bin/macos-arm64
          cp client-artifacts/hitl-client-macos-arm64/hitl-client-macos-arm64 \
             hitl-mcp-server/server/dist/bin/macos-arm64/hitl-client 2>/dev/null || true
          chmod +x hitl-mcp-server/server/dist/bin/macos-arm64/hitl-client 2>/dev/null || true

          # macOS x64
          mkdir -p hitl-mcp-server/server/dist/bin/macos-x64
          cp client-artifacts/hitl-client-macos-x64/hitl-client-macos-x64 \
             hitl-mcp-server/server/dist/bin/macos-x64/hitl-client 2>/dev/null || true
          chmod +x hitl-mcp-server/server/dist/bin/macos-x64/hitl-client 2>/dev/null || true

          echo "Bundled binaries:"
          find hitl-mcp-server/server/dist/bin -type f | head -20

      # Every cp above ends in `|| true`, and build-client sets fail-fast: false,
      # so a failed or unscheduled matrix leg would otherwise publish a package
      # silently missing that platform's client. 2.11.0 shipped with none at all
      # this way. Fail loudly instead.
      - name: Verify all client binaries are bundled
        run: |
          missing=0
          for p in windows-x64/hitl-client.exe \
                   linux-x64/hitl-client \
                   macos-arm64/hitl-client \
                   macos-x64/hitl-client; do
            if [ ! -s "hitl-mcp-server/server/dist/bin/$p" ]; then
              echo "::error::client binary missing or empty: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish an incomplete package."
            exit 1
          fi
          echo "All 4 client binaries present."

      # Runs only when an npm automation token is configured. Without one the
      # maintainer publishes by hand (the npm account requires interactive 2FA),
      # and that must not turn the tag's workflow run red.
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: hitl-mcp-server/server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note skipped npm publish
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not configured - skipping automated npm publish. Publish @achieveai/hitl-mcp-server manually from hitl-mcp-server/server."
