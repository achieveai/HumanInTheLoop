[package]
name = "hitl-client"
version = "2.11.3"
description = "Human-in-the-Loop cross-machine notification client"
authors = ["HITL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
hitl-transport = { path = "../../crates/hitl-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { version = "1", features = ["full"] }
uuid = { workspace = true }
dirs = { workspace = true }
hostname = { workspace = true }
futures-util = { workspace = true }
urlencoding = "2"
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
# `std` gates set_boxed_logger, which logging.rs uses to install the file logger.
log = { workspace = true, features = ["std"] }
rodio = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
