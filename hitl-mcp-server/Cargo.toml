[workspace]
resolver = "2"
members = [
    "client/src-tauri",
    "inbox/src-tauri",
    "crates/hitl-transport",
    "crates/hitl-store",
    "crates/hitl-archivist",
]

# Shared versions for every crate that talks to ntfy or the wire types, so a
# bump lands in one place instead of drifting between the client and the
# crates extracted out of it.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS is chosen per crate and platform (see hitl-transport): native TLS on the
# desktop, rustls on Android, where there is no system OpenSSL to link.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "macos-system-configuration"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
hostname = "0.4"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
log = "0.4"
# "bundled" compiles SQLite from source, so no host library has to be present
# on a build machine or a user's box. The store is a local projection file, not
# a service, and shipping the engine with it is what keeps it that way.
rusqlite = { version = "0.32", features = ["bundled"] }
