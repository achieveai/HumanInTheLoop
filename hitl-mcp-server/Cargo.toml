[workspace]
resolver = "2"
members = ["client/src-tauri", "crates/hitl-transport"]

# Shared versions for every crate that talks to ntfy or the wire types, so a
# bump lands in one place instead of drifting between the client and the
# crates extracted out of it.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
hostname = "0.4"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
log = "0.4"
