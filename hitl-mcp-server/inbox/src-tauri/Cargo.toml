[package]
name = "hitl-inbox"
# Lockstep with hitl-client, hitl-transport, hitl-store and hitl-archivist:
# every crate in this repo releases together, so a version that drifts here is
# a version that lies.
version = "2.17.0"
description = "The LLM Inbox — every agent's messages in one place"
authors = ["HITL"]
edition = "2021"

[lib]
name = "hitl_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No tray-icon feature: the Inbox is a window you open, not a background agent.
# hitl-client is the process the MCP server auto-launches and the one that owns
# the tray; a second tray icon for the same topic would be noise.
tauri = { version = "2", features = [] }
# Desktop toasts (Windows, macOS, Linux) and Android notifications for new
# questions, reviews, handoffs and notifications; see src/toast.rs.
tauri-plugin-notification = "~2.4"
hitl-transport = { path = "../../crates/hitl-transport" }
hitl-store = { path = "../../crates/hitl-store" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
log = { workspace = true, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

# Windows pops a toast up only for an app on the Start menu; a bare exe adds
# its own shortcut with these (see src/start_menu.rs). The same version Tauri
# uses, so no second copy is built.
[target.'cfg(windows)'.dependencies]
# The toast crate the notification plugin wraps, called directly on Windows to
# leave out the plugin's empty subtitle line (see show_toast in src/lib.rs).
tauri-winrt-notification = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
