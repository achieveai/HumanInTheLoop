<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Inbox — Test Harness</title>
    <!-- Same order as index.html, and for the same reason. See the comment there. -->
    <link rel="stylesheet" href="review.css">
    <link rel="stylesheet" href="inbox.css">
    <script src="vendor/markdown-it.min.js"></script>
    <script src="vendor/diff.min.js"></script>
    <!-- Mocks window.__TAURI__ so the real inbox.js / pane-agents.js /
         pane-list.js modules run outside a Tauri backend, mirroring
         review-harness.html and notifications-harness.html in client/.

         The fixture is delivered on `window.__INBOX_FIXTURE` rather than a
         query string: a whole message list does not survive query-string
         encoding, which is the same reason app.js stopped putting questions on
         the URL. Playwright sets it with page.addInitScript().

         The fixture is a *recording of what the Rust commands return*, never a
         reimplementation of them. Filtering, ordering, session state and the
         Unattributed grouping are all decided in Rust and tested there; what
         these tests check is that the panes draw what they are handed and ask
         for the right thing when clicked.

           window.__INBOX_FIXTURE = {
             sessions: <SessionTree>,
             messages: <MessageList> | { "<scopeKey>|<filter>": <MessageList> },
             details: { "<messageId>": <MessageDetail> },
             bodies:   { "<messageId>": <BodyOutcome> },
           }

         Every invoke() is recorded on window.__INVOCATIONS so a test can
         assert what the UI asked for, not just what it drew.

         When nothing injected __INBOX_FIXTURE (a plain browser, no Playwright
         init script), the harness downloads harness-fixture.json next to this
         file — a recording of the same commands made against the live
         ~/.hitl event log by `cargo test --release --lib
         dump_harness_fixture` (see src-tauri/src/fixture_dump.rs). The
         recording also carries `settings` (ConnectionSettings from
         ~/.hitl/config.json, desktop shape) which the
         get_connection_settings mock hands back. A missing or stale file is
         not an error: the empty fallbacks below apply, as before. -->
    <script>
        window.__INVOCATIONS = [];
        window.__listeners = {};

        // Resolves once a downloaded fixture (if any) is in place. Playwright
        // sets __INBOX_FIXTURE in an init script, which runs before this, so
        // tests never touch the network.
        window.__FIXTURE_READY = (async () => {
            if (window.__INBOX_FIXTURE) return;
            try {
                const response = await fetch('./harness-fixture.json', { cache: 'no-store' });
                if (!response.ok) return;
                const recorded = await response.json();
                window.__INBOX_FIXTURE = {
                    sessions: recorded.sessions,
                    messages: recorded.messages,
                    details: recorded.details,
                    bodies: recorded.bodies,
                };
                window.__HARNESS_SETTINGS = recorded.settings ?? null;
            } catch {
                // No recording: the empty fallbacks below apply.
            }
        })();

        // Search index for the agent tree: sessionKey -> lowercase text of
        // every message the recording holds (list rows, message details,
        // settlements). Built idle after first paint so the 80 MB recording
        // never blocks rendering; tree search reads it through
        // window.__INBOX_SEARCH_BODIES and simply matches metadata until
        // this resolves.
        window.__SEARCH_BODIES_READY = window.__FIXTURE_READY.then(() => {
            const fixture = window.__INBOX_FIXTURE ?? {};
            const idle = window.requestIdleCallback ?? (fn => setTimeout(fn, 1000));
            return new Promise(resolve => idle(() => {
                try {
                    const index = {};
                    const push = (key, text) => {
                        if (!key || !text) return;
                        const lower = String(text).toLowerCase();
                        index[key] = index[key] ? `${index[key]} ${lower}` : lower;
                    };
                    for (const list of Object.values(fixture.messages ?? {})) {
                        for (const row of list?.messages ?? []) {
                            push(row.sessionKey, [row.title, row.objective, row.contextSnippet, row.verdict]
                                .filter(Boolean).join(' '));
                        }
                    }
                    for (const detail of Object.values(fixture.details ?? {})) {
                        push(detail?.row?.sessionKey, JSON.stringify(detail?.request ?? {}));
                        push(detail?.row?.sessionKey, JSON.stringify(detail?.settlement ?? {}));
                    }
                    window.__INBOX_SEARCH_BODIES = index;
                } catch {
                    // Metadata-only search until a recording is in place.
                }
                resolve();
            }));
        });

        window.__TAURI__ = {
            core: {
                invoke: async (cmd, args) => {
                    await window.__FIXTURE_READY;
                    window.__INVOCATIONS.push({ cmd, args: args ?? null });
                    const fixture = window.__INBOX_FIXTURE ?? {};

                    if (cmd === 'get_connection_settings') {
                        return window.__HARNESS_SETTINGS ?? { mobile: false, configured: true, topicId: null };
                    }

                    // Desktop notifications: `window.__NOTIFICATIONS` holds the
                    // saved switch, and a test can set it to an Error to make
                    // the save fail.
                    if (cmd === 'get_notifications_enabled') {
                        return Promise.resolve(window.__NOTIFICATIONS ?? true);
                    }
                    if (cmd === 'set_notifications_enabled') {
                        if (window.__NOTIFICATIONS instanceof Error) return Promise.reject(window.__NOTIFICATIONS);
                        window.__NOTIFICATIONS = args.enabled;
                        return Promise.resolve(args.enabled);
                    }

                    if (cmd === 'list_sessions') {
                        return Promise.resolve(fixture.sessions ?? emptyTree());
                    }
                    if (cmd === 'list_messages') {
                        return Promise.resolve(resolveList(fixture.messages, args));
                    }
                    if (cmd === 'get_message') {
                        return resolveKeyed(fixture.details, args?.messageId, null);
                    }
                    if (cmd === 'get_body') {
                        return resolveKeyed(fixture.bodies, args?.messageId, { outcome: 'absent' });
                    }

                    // The reply commands (spec §9). Each returns the messageId
                    // it minted, exactly as the Rust does — that id is what
                    // `reply.js` compares against `row.responseId` to decide
                    // whether this device won the race, so a mock that returned
                    // nothing would make every submission look lost.
                    //
                    // `window.__REPLIES` lets a test pin the id (to match a
                    // fixture row's `responseId`) or make a publish fail.
                    if (cmd === 'submit_answer' || cmd === 'dismiss_notification' || cmd === 'send_agent_message') {
                        return reply(cmd, `resp-${window.__INVOCATIONS.length}`);
                    }
                    if (cmd === 'submit_plan_review') {
                        return reply(cmd, { status: 'received', responseId: 'resp-review', reason: null });
                    }
                    if (cmd === 'dismiss_notifications') {
                        return reply(cmd, (args?.notificationIds ?? []).map((notificationId, index) => ({
                            status: 'dismissed',
                            notificationId,
                            responseId: `bulk-dismiss-${index + 1}`,
                        })));
                    }
                    if (cmd === 'restore_notifications') {
                        return reply(cmd, (args?.restorations ?? []).map((restoration, index) => ({
                            status: 'restored',
                            ...restoration,
                            responseId: `bulk-restore-${index + 1}`,
                        })));
                    }
                    if (cmd === 'save_review_draft' || cmd === 'clear_review_draft') {
                        return reply(cmd, null);
                    }
                    if (cmd === 'load_review_draft') {
                        return reply(cmd, null);
                    }

                    return Promise.reject(new Error(`unmocked command: ${cmd}`));
                },
            },
            event: {
                listen: (name, callback) => {
                    window.__listeners[name] = callback;
                    return Promise.resolve(() => {});
                },
            },
        };

        // A reply command's answer. `window.__REPLIES[cmd]` overrides the
        // default; `{ __error }` there is a publish that never left the
        // machine, which is a distinct outcome from one that lost a race.
        function reply(cmd, fallback) {
            const pinned = window.__REPLIES?.[cmd];
            if (pinned === undefined) return Promise.resolve(fallback);
            if (pinned && pinned.__error) return Promise.reject(new Error(pinned.__error));
            return Promise.resolve(pinned);
        }

        function emptyTree() {
            return { projects: [], totalPending: 0, totalMessages: 0, scopeKey: 'all', now: 0 };
        }

        function emptyList(args) {
            return {
                messages: [],
                actionableNotificationIds: [],
                counts: { all: 0, needsYou: 0, answered: 0, notifications: 0 },
                filter: args?.filter ?? 'all',
                defaultFilter: 'all',
                scopeKey: args?.sessionKey ?? 'all',
                now: 0,
            };
        }

        // A bare MessageList answers every call; a keyed object lets a test
        // hand back a different one per (scope, filter) pair, which is how the
        // filter and selection tests assert that the UI re-asked.
        function resolveList(messages, args) {
            if (!messages) return emptyList(args);
            if (Array.isArray(messages.messages)) return messages;

            const scope = args?.sessionKey ?? 'all';
            const filter = args?.filter ?? null;
            return messages[`${scope}|${filter}`]
                ?? messages[`${scope}|*`]
                ?? messages[`*|${filter}`]
                ?? messages.default
                ?? emptyList(args);
        }

        // Per-message fixtures for pane 3, keyed by messageId.
        //
        // Three things a test needs to express and all three are shapes the
        // real commands produce:
        //   { ... }                     the value the command returns
        //   { __error: 'boom' }         the command itself failed
        //   { __delayMs: 50, value: X } a slow response, for the out-of-order test
        function resolveKeyed(table, key, fallback) {
            const entry = table?.[key];
            if (entry === undefined) return Promise.resolve(fallback);
            if (entry && entry.__error) return Promise.reject(new Error(entry.__error));
            if (entry && entry.__delayMs !== undefined) {
                return new Promise(resolve => setTimeout(() => resolve(entry.value), entry.__delayMs));
            }
            return Promise.resolve(entry);
        }

        // Lets a test push a live event through the real listener registered by
        // inbox.js, rather than reimplementing its refresh here.
        window.__simulateChange = () => window.__listeners['inbox-changed']?.({ payload: null });
    </script>

</head>
<body>
    <!-- Layout chrome (mobile spec §4). Hidden entirely at wide widths.
         Lives outside every pane because pane 3 clears its own container. -->
    <div class="inbox-bar">
        <button id="pane-back" aria-label="Back">←</button>
        <button id="agents-toggle" aria-label="Agents">☰</button>
        <button id="pane-cycle" aria-label="Collapse panes" title="Collapse panes (Ctrl+B)">◧</button>
        <button id="reading-pane-toggle" aria-label="Place reading pane below message list"
                title="Place reading pane below message list">▥</button>
        <button id="notifications-toggle" aria-pressed="true" aria-label="Desktop notifications"
                title="Desktop notifications">🔔</button>
        <button id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Dark mode"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg></button>
        <span class="inbox-bar-title">Inbox</span>
    </div>
    <div class="inbox-scrim" id="inbox-scrim"></div>

    <div class="inbox">
        <aside class="pane pane-agents" id="pane-agents" aria-label="Agents"></aside>
        <section class="pane pane-list" id="pane-list" aria-label="Messages">
            <div class="filter-bar" id="filter-bar" role="tablist"></div>
            <div class="type-filter-bar" id="type-filter-bar">
                <div class="type-filter-set" id="type-filter-set" role="group" aria-label="Message types"></div>
                <div class="list-actions" id="list-actions">
                    <span class="visually-hidden" id="mark-all-read-description"></span>
                    <button class="mark-all-read" type="button"
                            aria-describedby="mark-all-read-description" hidden></button>
                </div>
            </div>
            <div class="bulk-status" id="bulk-status" role="status" aria-live="polite"
                 aria-atomic="true" hidden>
                <span class="bulk-status-message"></span>
                <button class="undo-mark-all-read" type="button">Undo mark all read</button>
                <button class="dismiss-bulk-status" type="button" aria-label="Dismiss Undo">Dismiss</button>
            </div>
            <div class="message-list" id="message-list"></div>
        </section>
        <section class="pane pane-detail" id="pane-detail" aria-label="Detail"></section>
        <button class="pane-handle" id="pane-handle-1" aria-label="Resize agents" role="separator"
                aria-controls="pane-agents" aria-orientation="vertical" tabindex="0"></button>
        <button class="pane-handle" id="pane-handle-2" aria-label="Resize message list" role="separator"
                aria-controls="pane-list" aria-orientation="vertical" tabindex="0"></button>
    </div>

    <dialog class="action-error-dialog" id="action-error-dialog" aria-labelledby="action-error-title">
        <form method="dialog">
            <h2 id="action-error-title">Could not send</h2>
            <p class="action-error-message" role="alert"></p>
            <button class="button button-primary" type="submit">Close</button>
        </form>
    </dialog>

    <script type="module" src="inbox.js"></script>
</body>
